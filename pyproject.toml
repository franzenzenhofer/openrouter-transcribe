[project]
name = "openrouter-transcribe"
version = "0.1.0"
description = "Long recordings (workshops, meetings, interviews) to a reviewed, speaker-named transcript via OpenRouter, with local voice fingerprints for the names."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "sherpa-onnx>=1.13.8", "sherpa-onnx-core>=1.13.8"]

[project.scripts]
openrouter-transcribe = "openrouter_transcribe.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openrouter_transcribe"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["sherpa_onnx"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
